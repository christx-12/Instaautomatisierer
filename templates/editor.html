<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CutFlow – Editor</title>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&f[]=cabinet-grotesk@800,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- ══ TOP BAR ══════════════════════════════════════════════ -->
<header class="topbar">
  <a href="/" class="logo-wrap" title="Zurück zur Startseite">
    <div class="logo-mark" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 20 20" fill="none">
        <rect x="2"  y="2"  width="7" height="7" rx="1.5" fill="currentColor" opacity="0.9"/>
        <rect x="11" y="2"  width="7" height="7" rx="1.5" fill="currentColor" opacity="0.55"/>
        <rect x="2"  y="11" width="7" height="7" rx="1.5" fill="currentColor" opacity="0.55"/>
        <path d="M11 14.5H17M14 11.5V17.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </div>
    <span class="logo-name">CutFlow</span>
  </a>

  <div class="topbar-sep"></div>

  <!-- Audio Upload -->
  <label class="upload-btn" id="audioBtnLabel" title="Audiodatei hochladen">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 18V5l12-2v13"/>
      <circle cx="6"  cy="18" r="3"/>
      <circle cx="18" cy="16" r="3"/>
    </svg>
    <span id="audioBtnText">Audio</span>
    <input type="file" id="audioUpload" accept="audio/*" aria-label="Audiodatei auswählen">
  </label>

  <!-- Video Upload -->
  <label class="upload-btn" title="Videos hinzufügen">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M15 10l4.553-2.069A1 1 0 0 1 21 8.87v6.26a1 1 0 0 1-1.447.9L15 14M3 8a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8z"/>
    </svg>
    <span>Video +</span>
    <input type="file" id="videoUpload" accept="video/*" multiple aria-label="Videos auswählen">
  </label>

  <div class="topbar-sep"></div>

  <!-- Play / Stop -->
  <button class="play-btn" id="playAllBtn" aria-label="Timeline abspielen">
    <svg id="playIcon" width="13" height="13" viewBox="0 0 24 24" aria-hidden="true">
      <polygon points="5 3 19 12 5 21 5 3" fill="currentColor"/>
    </svg>
    <span id="playLabel">Abspielen</span>
  </button>

  <div class="topbar-sep"></div>

  <!-- Format Toggle -->
  <button class="upload-btn" id="formatToggleBtn" aria-label="Format wechseln">
    Format: 16:9
  </button>

  <div class="topbar-sep"></div>

  <!-- Bar-Länge Badge -->
  <div class="bar-badge" title="Erkannte Taktlänge in Sekunden">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
    </svg>
    <span id="barBadgeText">–</span>
  </div>

  <!-- Status Pill -->
  <div class="status-pill" id="statusPill">
    <span class="status-pill-dot"></span>
    <span id="statusText">Bereit</span>
  </div>

  <div class="topbar-spacer"></div>

  <!-- Lautstärke (Volume) -->
  <div style="display: flex; align-items: center; gap: 0.4rem; color: var(--text-muted); margin-right: 0.2rem;" title="Musik-Lautstärke im Editor">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
    </svg>
    <input type="range" id="musicVolume" min="0" max="1" step="0.05" value="1" 
           style="width: 60px; height: 4px; accent-color: var(--primary); cursor: pointer; border-radius: var(--r-full);">
  </div>
  
  <div class="topbar-sep" style="margin-left: 0.5rem;"></div>

  <!-- Session löschen -->
  <button class="icon-btn" id="clearSessionBtn" title="Session löschen" aria-label="Session löschen">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="3 6 5 6 21 6"/>
      <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
      <path d="M10 11v6M14 11v6M9 6V4h6v2"/>
    </svg>
  </button>

  <!-- Theme Toggle -->
  <button class="icon-btn" data-theme-toggle aria-label="Design-Modus wechseln">
    <!-- Icon wird per JS gesetzt -->
  </button>
</header>

<!-- ══ PREVIEW ═══════════════════════════════════════════════ -->
<div class="preview-area">
  <div class="player-wrapper" id="videoEngine">
    <!-- Video-Layer werden per JS injiziert -->
  </div>

  <!-- Empty State -->
  <div class="preview-empty" id="previewEmpty">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="2" y="3" width="20" height="14" rx="2"/>
      <path d="M8 21h8M12 17v4"/>
    </svg>
    <p>Lade Videos hoch oder ziehe sie in die Timeline</p>
  </div>

  <!-- Fortschrittsbalken -->
  <div class="preview-progress-wrap">
    <div class="preview-progress-bar" id="progressBar"></div>
  </div>

  <!-- Zeitanzeige -->
  <div class="time-overlay" id="timeOverlay">0.00s</div>
</div>

<!-- ══ TIMELINE ══════════════════════════════════════════════ -->
<div class="timeline-panel">
  <div class="timeline-header">
    <span class="timeline-label">Timeline</span>
    <span class="clip-count" id="clipCount">0</span>
    <div style="flex:1"></div>
    <span class="timeline-hint">← scrollen · Clip anklicken zum Abspielen · Leertaste Play/Stop</span>
  </div>
  <button id="songModeToggle" class="btn-secondary">
  🎵 Song-Einstellungen
</button>
  <div class="timeline-scroll" id="timeline" role="list" aria-label="Timeline Clips">
    <!-- Clip-Karten werden per JS injiziert -->

    <!-- Dropzone (immer am Ende) -->
    <div class="timeline-dropzone" id="tlDropzone" role="button" tabindex="0"
         aria-label="Video hinzufügen – klicken oder hierher ziehen">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      <span>Video +</span>
    </div>
  </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="false"></div>

<!-- Verstecktes Audio-Element -->
<audio id="bgMusic" preload="auto" style="display:none;"></audio>

<script src="/static/script.js"></script>
</body>
</html>
