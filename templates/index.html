<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Web Video Editor - Frame Sync</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Mein Cloud Editor</h1>
            <div class="controls">
                <input type="file" id="audioUpload" accept="audio/*">

                <audio id="bgMusic" style="display:none;" preload="auto"></audio>
                <input type="file" id="videoUpload" accept="video/*" multiple>
                <button id="playAllBtn" style="background: #28a745; color: white;">▶ Timeline abspielen</button>
                <button id="clearSessionBtn">Session löschen</button>
            </div>
        </header>

        <main>
            <div class="player-section">
                <div id="videoEngine" class="player-wrapper"></div>
                <p id="playerStatus">Warte auf Videos...</p>
            </div>

            <div class="timeline-section">
                <h3>Timeline</h3>
                <div id="timeline" class="timeline-container"></div>
            </div>
        </main>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
