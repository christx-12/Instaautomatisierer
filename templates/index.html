<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CutFlow – Videoprojekte</title>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&f[]=cabinet-grotesk@800,900&display=swap" rel="stylesheet">
  <style>
    /* ── Design Tokens ── */
    :root, [data-theme="light"] {
      --color-bg:              #f7f6f2;
      --color-surface:         #f9f8f5;
      --color-surface-2:       #fbfbf9;
      --color-surface-offset:  #f3f0ec;
      --color-surface-dynamic: #e6e4df;
      --color-divider:         #dcd9d5;
      --color-border:          #d4d1ca;
      --color-text:            #28251d;
      --color-text-muted:      #7a7974;
      --color-text-faint:      #bab9b4;
      --color-primary:         #01696f;
      --color-primary-hover:   #0c4e54;
      --color-primary-active:  #0f3638;
      --color-primary-highlight: #cedcd8;
      --color-warning:         #964219;
      --shadow-sm: 0 1px 2px oklch(0.2 0.01 80 / 0.06);
      --shadow-md: 0 4px 12px oklch(0.2 0.01 80 / 0.08);
      --shadow-lg: 0 12px 32px oklch(0.2 0.01 80 / 0.12);
      --radius-sm: 0.375rem;
      --radius-md: 0.5rem;
      --radius-lg: 0.75rem;
      --radius-xl: 1rem;
      --radius-full: 9999px;
      --transition: 180ms cubic-bezier(0.16, 1, 0.3, 1);
      --text-xs:   clamp(0.75rem,  0.7rem  + 0.25vw, 0.875rem);
      --text-sm:   clamp(0.875rem, 0.8rem  + 0.35vw, 1rem);
      --text-base: clamp(1rem,     0.95rem + 0.25vw, 1.125rem);
      --text-lg:   clamp(1.125rem, 1rem    + 0.75vw, 1.5rem);
      --text-xl:   clamp(1.5rem,   1.2rem  + 1.25vw, 2.25rem);
      --text-2xl:  clamp(2rem,     1.2rem  + 2.5vw,  3.5rem);
      --font-display: 'Cabinet Grotesk', 'Helvetica Neue', sans-serif;
      --font-body:    'Satoshi', 'Inter', sans-serif;
      --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem;
      --space-4: 1rem;    --space-6: 1.5rem; --space-8: 2rem;
      --space-10: 2.5rem; --space-12: 3rem;  --space-16: 4rem;
    }
    [data-theme="dark"] {
      --color-bg:              #171614;
      --color-surface:         #1c1b19;
      --color-surface-2:       #201f1d;
      --color-surface-offset:  #1d1c1a;
      --color-surface-dynamic: #2d2c2a;
      --color-divider:         #262523;
      --color-border:          #393836;
      --color-text:            #cdccca;
      --color-text-muted:      #797876;
      --color-text-faint:      #5a5957;
      --color-primary:         #4f98a3;
      --color-primary-hover:   #227f8b;
      --color-primary-active:  #1a626b;
      --color-primary-highlight: #313b3b;
      --color-warning:         #bb653b;
      --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.2);
      --shadow-md: 0 4px 12px oklch(0 0 0 / 0.3);
      --shadow-lg: 0 12px 32px oklch(0 0 0 / 0.4);
    }

    /* ── Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
    body {
      min-height: 100dvh;
      font-family: var(--font-body);
      font-size: var(--text-base);
      color: var(--color-text);
      background: var(--color-bg);
      display: flex;
      flex-direction: column;
      transition: background var(--transition), color var(--transition);
      overflow-x: hidden;
    }
    button { cursor: pointer; background: none; border: none; font: inherit; color: inherit; }
    img, svg { display: block; }
    ::selection { background: oklch(from var(--color-primary) l c h / 0.25); color: var(--color-text); }
    :focus-visible { outline: 2px solid var(--color-primary); outline-offset: 3px; border-radius: var(--radius-sm); }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-4) var(--space-8);
      border-bottom: 1px solid oklch(from var(--color-text) l c h / 0.08);
      background: var(--color-surface);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      text-decoration: none;
      color: var(--color-text);
    }
    .logo-mark {
      width: 36px; height: 36px;
      background: var(--color-primary);
      border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      color: #fff;
      flex-shrink: 0;
    }
    .logo-name {
      font-family: var(--font-display);
      font-size: var(--text-lg);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--color-text);
    }
    .theme-toggle {
      width: 38px; height: 38px;
      display: flex; align-items: center; justify-content: center;
      border-radius: var(--radius-md);
      color: var(--color-text-muted);
      transition: background var(--transition), color var(--transition);
    }
    .theme-toggle:hover { background: var(--color-surface-offset); color: var(--color-text); }

    /* ── Hero ── */
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(var(--space-12), 8vw, var(--space-16)) var(--space-8);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    /* subtle grid bg */
    .hero::before {
      content: '';
      position: absolute; inset: 0;
      background-image:
        linear-gradient(oklch(from var(--color-primary) l c h / 0.04) 1px, transparent 1px),
        linear-gradient(90deg, oklch(from var(--color-primary) l c h / 0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: radial-gradient(ellipse 80% 60% at 50% 50%, black 40%, transparent 100%);
      pointer-events: none;
    }
    .hero-eyebrow {
      font-size: var(--text-xs);
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-primary);
      margin-bottom: var(--space-4);
      opacity: 0;
      animation: fadeUp 0.5s 0.1s forwards;
    }
    .hero-title {
      font-family: var(--font-display);
      font-size: clamp(2.2rem, 5vw, 4rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1.05;
      color: var(--color-text);
      max-width: 14ch;
      margin-bottom: var(--space-4);
      opacity: 0;
      animation: fadeUp 0.5s 0.2s forwards;
    }
    .hero-sub {
      font-size: var(--text-base);
      color: var(--color-text-muted);
      max-width: 44ch;
      line-height: 1.65;
      margin-bottom: var(--space-10);
      opacity: 0;
      animation: fadeUp 0.5s 0.3s forwards;
    }

    /* ── Cards ── */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr));
      gap: var(--space-4);
      width: 100%;
      max-width: 680px;
      opacity: 0;
      animation: fadeUp 0.5s 0.4s forwards;
    }
    .card {
      background: var(--color-surface);
      border: 1px solid oklch(from var(--color-text) l c h / 0.09);
      border-radius: var(--radius-xl);
      padding: var(--space-6);
      text-align: left;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: box-shadow var(--transition), border-color var(--transition), transform var(--transition), background var(--transition);
      box-shadow: var(--shadow-sm);
    }
    .card::after {
      content: '';
      position: absolute; inset: 0;
      background: oklch(from var(--color-primary) l c h / 0);
      transition: background var(--transition);
      pointer-events: none;
      border-radius: inherit;
    }
    .card:hover {
      box-shadow: var(--shadow-lg);
      border-color: var(--color-primary);
      transform: translateY(-2px);
    }
    .card:hover::after { background: oklch(from var(--color-primary) l c h / 0.03); }
    .card:active { transform: translateY(0); box-shadow: var(--shadow-md); }

    .card--saved { display: none; } /* shown by JS if data exists */
    .card--saved.visible { display: block; }

    .card-icon {
      width: 44px; height: 44px;
      border-radius: var(--radius-lg);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: var(--space-4);
      background: var(--color-primary-highlight);
      color: var(--color-primary);
      flex-shrink: 0;
    }
    .card--saved .card-icon {
      background: color-mix(in oklch, var(--color-warning) 15%, var(--color-surface));
      color: var(--color-warning);
    }
    .card-title {
      font-family: var(--font-display);
      font-size: var(--text-lg);
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--color-text);
      margin-bottom: var(--space-2);
    }
    .card-desc {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      line-height: 1.6;
    }
    .card-meta {
      margin-top: var(--space-4);
      padding-top: var(--space-4);
      border-top: 1px solid oklch(from var(--color-text) l c h / 0.08);
      display: flex;
      align-items: center;
      gap: var(--space-2);
      font-size: var(--text-xs);
      color: var(--color-text-faint);
    }
    .card-meta-dot {
      width: 6px; height: 6px;
      border-radius: var(--radius-full);
      background: var(--color-primary);
      flex-shrink: 0;
    }
    .card--saved .card-meta-dot { background: var(--color-warning); }

    /* skeleton for saved card loading */
    .skeleton-line {
      height: 0.85em;
      border-radius: var(--radius-sm);
      background: linear-gradient(90deg,
        var(--color-surface-offset) 25%,
        var(--color-surface-dynamic) 50%,
        var(--color-surface-offset) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s ease-in-out infinite;
    }

    /* ── Stat chips ── */
    .stats-row {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      flex-wrap: wrap;
      margin-top: var(--space-3);
    }
    .stat-chip {
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
      padding: 0.2em var(--space-3);
      border-radius: var(--radius-full);
      background: var(--color-surface-offset);
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      font-weight: 500;
    }

    /* ── Footer hint ── */
    .footer-hint {
      text-align: center;
      padding: var(--space-6) var(--space-8);
      font-size: var(--text-xs);
      color: var(--color-text-faint);
      border-top: 1px solid oklch(from var(--color-text) l c h / 0.06);
    }

    /* ── Animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes shimmer {
      0%   { background-position: -200% 0; }
      100% { background-position:  200% 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* ── Mobile ── */
    @media (max-width: 480px) {
      .header { padding: var(--space-3) var(--space-4); }
      .hero { padding: var(--space-10) var(--space-4); }
      .cards { gap: var(--space-3); }
      .card { padding: var(--space-5); }
    }
  </style>
</head>
<body>

<!-- Header -->
<header class="header">
  <a href="#" class="logo">
    <!-- SVG Logo Mark -->
    <div class="logo-mark" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="2" width="7" height="7" rx="1.5" fill="currentColor" opacity="0.9"/>
        <rect x="11" y="2" width="7" height="7" rx="1.5" fill="currentColor" opacity="0.55"/>
        <rect x="2" y="11" width="7" height="7" rx="1.5" fill="currentColor" opacity="0.55"/>
        <path d="M11 14.5L17 14.5M14 11.5L14 17.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </div>
    <span class="logo-name">CutFlow</span>
  </a>
  <button class="theme-toggle" data-theme-toggle aria-label="Design-Modus wechseln">
    <!-- Moon icon (dark mode) -->
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  </button>
</header>

<!-- Hero -->
<main class="hero" id="main-content">
  <p class="hero-eyebrow">Video Editor</p>
  <h1 class="hero-title">Was möchtest du tun?</h1>
  <p class="hero-sub">Starte ein neues Schneidprojekt oder mach direkt weiter, wo du aufgehört hast.</p>

  <div class="cards" id="cards">

    <!-- New Project -->
    <button class="card card--new" id="btn-new" onclick="startNew()">
      <div class="card-icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="12" y1="18" x2="12" y2="12"/>
          <line x1="9" y1="15" x2="15" y2="15"/>
        </svg>
      </div>
      <div class="card-title">Neues Projekt</div>
      <p class="card-desc">Leere Timeline – Videos hochladen und von vorne beginnen.</p>
      <div class="card-meta">
        <span class="card-meta-dot"></span>
        <span>Leere Timeline</span>
      </div>
    </button>

    <!-- Saved Project (hidden until data found) -->
    <button class="card card--saved" id="btn-saved" onclick="loadSaved()">
      <div class="card-icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"/>
          <path d="M3.51 15a9 9 0 1 0 .49-3.51"/>
        </svg>
      </div>
      <div class="card-title">Projekt fortsetzen</div>
      <p class="card-desc" id="saved-desc">Zuletzt gespeicherter Stand laden und weiterarbeiten.</p>
      <div class="stats-row" id="saved-stats"></div>
      <div class="card-meta">
        <span class="card-meta-dot"></span>
        <span id="saved-meta-text">Gespeichert in dieser Sitzung</span>
      </div>
    </button>

  </div>
</main>

<footer class="footer-hint">
  Daten werden in dieser Browser-Sitzung gespeichert.
</footer>

<script>
  // ── Theme Toggle ──────────────────────────────────────────────
  (function(){
    const btn = document.querySelector('[data-theme-toggle]');
    const root = document.documentElement;
    const prefersDark = matchMedia('(prefers-color-scheme: dark)').matches;
    let theme = prefersDark ? 'dark' : 'light';
    root.setAttribute('data-theme', theme);
    setIcon();

    btn.addEventListener('click', () => {
      theme = theme === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', theme);
      btn.setAttribute('aria-label', 'Zu ' + (theme === 'dark' ? 'hellem' : 'dunklem') + ' Modus wechseln');
      setIcon();
    });

    function setIcon() {
      btn.innerHTML = theme === 'dark'
        ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>'
        : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
    }
  })();

  // ── Check for saved project ───────────────────────────────────
  async function checkSavedProject() {
    try {
      const res = await fetch('/load');
      if (!res.ok) return;
      const data = await res.json();
      const timeline = data.timeline || [];
      if (timeline.length === 0) return;

      // Count distinct video clips
      const clips = timeline.filter(item => item.type === 'video' || !item.type);
      const duration = timeline.reduce((acc, item) => acc + (item.duration || 0), 0);
      const audioTracks = timeline.filter(item => item.type === 'audio').length;

      // Build stat chips
      const statsEl = document.getElementById('saved-stats');
      const chips = [];
      if (clips.length > 0) chips.push(`${clips.length} Clip${clips.length !== 1 ? 's' : ''}`);
      if (audioTracks > 0) chips.push(`${audioTracks} Audio`);
      if (duration > 0) chips.push(formatDuration(duration));
      statsEl.innerHTML = chips.map(c =>
        `<span class="stat-chip">${c}</span>`
      ).join('');

      document.getElementById('saved-desc').textContent =
        `Gespeicherter Stand mit ${timeline.length} Element${timeline.length !== 1 ? 'en' : ''} gefunden.`;
      document.getElementById('saved-meta-text').textContent = 'Gespeichert in dieser Sitzung';

      document.getElementById('btn-saved').classList.add('visible');

    } catch(e) {
      // /load not reachable or empty – just don't show the card
    }
  }

  function formatDuration(seconds) {
    const m = Math.floor(seconds / 60);
    const s = Math.round(seconds % 60);
    return m > 0 ? `${m}m ${s}s` : `${s}s`;
  }

  // ── Actions ──────────────────────────────────────────────────
  function startNew() {
    // Clear saved data, then go to editor
    fetch('/sync', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ timeline: [] })
    }).finally(() => {
      window.location.href = '/editor';
    });
  }

  function loadSaved() {
    window.location.href = '/editor';
  }

  // ── Init ─────────────────────────────────────────────────────
  checkSavedProject();
</script>
</body>
</html>
