<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BeatCut – Videoprojekte</title>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&f[]=cabinet-grotesk@800,900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:              #101728;
      --surface:         #161e30;
      --surface-2:       #1b2438;
      --surface-off:     #1e2840;
      --surface-dyn:     #243050;
      --divider:         #1a2238;
      --border:          #000000;
      --text:            #ffffff;
      --text-muted:      #a09db8;
      --text-faint:      #5a5770;
      --primary:         #9340ff;
      --primary-h:       #7a28e0;
      --primary-hl:      #1e1040;
      --warn:            #f59e0b;
      --error:           #f43f5e;
      --success:         #22c55e;
      --shadow-sm:  0 1px 2px  oklch(0 0 0 / 0.35);
      --shadow-md:  0 4px 16px oklch(0 0 0 / 0.5);
      --shadow-lg:  0 12px 36px oklch(0 0 0 / 0.6);
      --radius-sm:   0.375rem;
      --radius-md:   0.5rem;
      --radius-lg:   0.75rem;
      --radius-xl:   1rem;
      --radius-full: 9999px;
      --transition:  180ms cubic-bezier(0.16, 1, 0.3, 1);
      --text-xs:   clamp(0.75rem,  0.7rem  + 0.25vw, 0.875rem);
      --text-sm:   clamp(0.875rem, 0.8rem  + 0.35vw, 1rem);
      --text-base: clamp(1rem,     0.95rem + 0.25vw, 1.125rem);
      --text-lg:   clamp(1.125rem, 1rem    + 0.75vw, 1.5rem);
      --text-xl:   clamp(1.5rem,   1.2rem  + 1.25vw, 2.25rem);
      --font-display: 'Cabinet Grotesk', 'Helvetica Neue', sans-serif;
      --font-body:    'Satoshi', 'Inter', sans-serif;
      --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem;
      --space-4: 1rem;    --space-6: 1.5rem; --space-8: 2rem;
      --space-10: 2.5rem; --space-12: 3rem;  --space-16: 4rem;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
    body {
      min-height: 100dvh;
      font-family: var(--font-body);
      font-size: var(--text-base);
      color: var(--text);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    button { cursor: pointer; background: none; border: none; font: inherit; color: inherit; }
    img, svg { display: block; }
    ::selection { background: oklch(from var(--primary) l c h / 0.3); color: var(--text); }
    :focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; border-radius: var(--radius-sm); }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-4) var(--space-8);
      border-bottom: 1px solid #000;
      background: var(--surface);
    }
    .logo {
      display: flex; align-items: center; gap: var(--space-3);
      text-decoration: none; color: var(--text);
    }
    .logo-mark {
      width: 36px; height: 36px;
      background: var(--primary);
      border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      color: #fff; flex-shrink: 0;
      box-shadow: 0 0 16px oklch(from var(--primary) l c h / 0.5);
    }
    .logo-name {
      font-family: var(--font-display);
      font-size: var(--text-lg);
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #fff 30%, var(--primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .theme-toggle {
      width: 38px; height: 38px;
      display: flex; align-items: center; justify-content: center;
      border-radius: var(--radius-md);
      color: var(--text-muted);
      transition: background var(--transition), color var(--transition);
    }
    .theme-toggle:hover { background: var(--surface-off); color: var(--text); }

    /* ── Hero ── */
    .hero {
      flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: clamp(var(--space-12), 8vw, var(--space-16)) var(--space-8);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute; inset: 0;
      background-image:
        linear-gradient(oklch(from var(--primary) l c h / 0.05) 1px, transparent 1px),
        linear-gradient(90deg, oklch(from var(--primary) l c h / 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: radial-gradient(ellipse 80% 60% at 50% 50%, black 40%, transparent 100%);
      pointer-events: none;
    }
    /* purple ambient glow */
    .hero::after {
      content: '';
      position: absolute;
      width: 600px; height: 400px;
      top: 50%; left: 50%;
      transform: translate(-50%, -60%);
      background: radial-gradient(ellipse, oklch(from var(--primary) l c h / 0.12) 0%, transparent 70%);
      pointer-events: none;
    }
    .hero-eyebrow {
      font-size: var(--text-xs);
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: var(--space-4);
      opacity: 0;
      animation: fadeUp 0.5s 0.1s forwards;
      position: relative; z-index: 1;
      text-shadow: 0 0 12px oklch(from var(--primary) l c h / 0.5);
    }
    .hero-title {
      font-family: var(--font-display);
      font-size: clamp(2.2rem, 5vw, 4rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1.05;
      color: var(--text);
      max-width: 14ch;
      margin-bottom: var(--space-4);
      opacity: 0;
      animation: fadeUp 0.5s 0.2s forwards;
      position: relative; z-index: 1;
    }
    .hero-sub {
      font-size: var(--text-base);
      color: var(--text-muted);
      max-width: 44ch;
      line-height: 1.65;
      margin-bottom: var(--space-10);
      opacity: 0;
      animation: fadeUp 0.5s 0.3s forwards;
      position: relative; z-index: 1;
    }

    /* ── Cards ── */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr));
      gap: var(--space-4);
      width: 100%;
      max-width: 680px;
      opacity: 0;
      animation: fadeUp 0.5s 0.4s forwards;
      position: relative; z-index: 1;
    }
    .card {
      background: var(--surface);
      border: 1px solid #000;
      border-radius: var(--radius-xl);
      padding: var(--space-6);
      text-align: left;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: box-shadow var(--transition), border-color var(--transition), transform var(--transition), background var(--transition);
      box-shadow: var(--shadow-sm);
    }
    .card::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, oklch(from var(--primary) l c h / 0.04) 0%, transparent 60%);
      opacity: 0;
      transition: opacity var(--transition);
      pointer-events: none;
      border-radius: inherit;
    }
    .card:hover {
      box-shadow: var(--shadow-lg), 0 0 0 1px oklch(from var(--primary) l c h / 0.5);
      border-color: oklch(from var(--primary) l c h / 0.6);
      transform: translateY(-3px);
    }
    .card:hover::before { opacity: 1; }
    .card:active { transform: translateY(0); box-shadow: var(--shadow-md); }

    .card--saved { display: none; }
    .card--saved.visible { display: block; }

    .card-icon {
      width: 44px; height: 44px;
      border-radius: var(--radius-lg);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: var(--space-4);
      background: var(--primary-hl);
      color: var(--primary);
      flex-shrink: 0;
      box-shadow: 0 0 12px oklch(from var(--primary) l c h / 0.25);
    }
    .card--saved .card-icon {
      background: color-mix(in oklch, var(--warn) 15%, var(--surface));
      color: var(--warn);
      box-shadow: 0 0 12px oklch(from var(--warn) l c h / 0.2);
    }
    .card-title {
      font-family: var(--font-display);
      font-size: var(--text-lg);
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: var(--space-2);
    }
    .card-desc {
      font-size: var(--text-sm);
      color: var(--text-muted);
      line-height: 1.6;
    }
    .card-meta {
      margin-top: var(--space-4);
      padding-top: var(--space-4);
      border-top: 1px solid #000;
      display: flex; align-items: center; gap: var(--space-2);
      font-size: var(--text-xs);
      color: var(--text-faint);
    }
    .card-meta-dot {
      width: 6px; height: 6px;
      border-radius: var(--radius-full);
      background: var(--primary);
      flex-shrink: 0;
      box-shadow: 0 0 6px var(--primary);
    }
    .card--saved .card-meta-dot {
      background: var(--warn);
      box-shadow: 0 0 6px var(--warn);
    }

    .skeleton-line {
      height: 0.85em;
      border-radius: var(--radius-sm);
      background: linear-gradient(90deg,
        var(--surface-off) 25%,
        var(--surface-dyn) 50%,
        var(--surface-off) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s ease-in-out infinite;
    }

    .stats-row {
      display: flex; align-items: center;
      gap: var(--space-2); flex-wrap: wrap;
      margin-top: var(--space-3);
    }
    .stat-chip {
      display: inline-flex; align-items: center; gap: var(--space-1);
      padding: 0.2em var(--space-3);
      border-radius: var(--radius-full);
      background: var(--surface-off);
      border: 1px solid #000;
      font-size: var(--text-xs);
      color: var(--text-muted);
      font-weight: 500;
    }

    /* ── Footer ── */
    .footer-hint {
      text-align: center;
      padding: var(--space-6) var(--space-8);
      font-size: var(--text-xs);
      color: var(--text-faint);
      border-top: 1px solid #000;
    }

    /* ── Animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes shimmer {
      0%   { background-position: -200% 0; }
      100% { background-position:  200% 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
    @media (max-width: 480px) {
      .header { padding: var(--space-3) var(--space-4); }
      .hero { padding: var(--space-10) var(--space-4); }
      .cards { gap: var(--space-3); }
      .card { padding: var(--space-5); }
    }
  </style>
</head>
<body>

<header class="header">
  <a href="#" class="logo">
    <div class="logo-mark" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="2" width="7" height="7" rx="1.5" fill="currentColor" opacity="0.9"/>
        <rect x="11" y="2" width="7" height="7" rx="1.5" fill="currentColor" opacity="0.55"/>
        <rect x="2" y="11" width="7" height="7" rx="1.5" fill="currentColor" opacity="0.55"/>
        <path d="M11 14.5L17 14.5M14 11.5L14 17.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </div>
    <span class="logo-name">BeatCut</span>
  </a>
  <button class="theme-toggle" data-theme-toggle aria-label="Design-Modus wechseln">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  </button>
</header>

<main class="hero" id="main-content">
  <p class="hero-eyebrow">Video Editor</p>
  <h1 class="hero-title">Was möchtest du tun?</h1>
  <p class="hero-sub">Starte ein neues Schneidprojekt oder mach direkt weiter, wo du aufgehört hast.</p>

  <div class="cards" id="cards">
    <button class="card card--new" id="btn-new" onclick="startNew()">
      <div class="card-icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="12" y1="18" x2="12" y2="12"/>
          <line x1="9" y1="15" x2="15" y2="15"/>
        </svg>
      </div>
      <div class="card-title">Neues Projekt</div>
      <p class="card-desc">Leere Timeline – Videos hochladen und von vorne beginnen.</p>
      <div class="card-meta">
        <span class="card-meta-dot"></span>
        <span>Leere Timeline</span>
      </div>
    </button>

    <button class="card card--saved" id="btn-saved" onclick="loadSaved()">
      <div class="card-icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"/>
          <path d="M3.51 15a9 9 0 1 0 .49-3.51"/>
        </svg>
      </div>
      <div class="card-title">Projekt fortsetzen</div>
      <p class="card-desc" id="saved-desc">Zuletzt gespeicherter Stand laden und weiterarbeiten.</p>
      <div class="stats-row" id="saved-stats"></div>
      <div class="card-meta">
        <span class="card-meta-dot"></span>
        <span id="saved-meta-text">Gespeichert in dieser Sitzung</span>
      </div>
    </button>
  </div>
</main>

<footer class="footer-hint">
  Daten werden in dieser Browser-Sitzung gespeichert.
</footer>

<script>
  (function(){
    const btn = document.querySelector('[data-theme-toggle]');
    const root = document.documentElement;
    let theme = 'dark';
    root.setAttribute('data-theme', theme);

    btn.addEventListener('click', () => {
      theme = theme === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', theme);
      btn.setAttribute('aria-label', 'Zu ' + (theme === 'dark' ? 'hellem' : 'dunklem') + ' Modus wechseln');
      setIcon();
    });

    function setIcon() {
      btn.innerHTML = theme === 'dark'
        ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>'
        : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
    }
  })();

  async function checkSavedProject() {
    try {
      const res = await fetch('/load');
      if (!res.ok) return;
      const data = await res.json();
      const timeline = data.timeline || [];
      if (timeline.length === 0) return;
      const clips = timeline.filter(item => item.type === 'video' || !item.type);
      const duration = timeline.reduce((acc, item) => acc + (item.duration || 0), 0);
      const audioTracks = timeline.filter(item => item.type === 'audio').length;
      const statsEl = document.getElementById('saved-stats');
      const chips = [];
      if (clips.length > 0) chips.push(`${clips.length} Clip${clips.length !== 1 ? 's' : ''}`);
      if (audioTracks > 0) chips.push(`${audioTracks} Audio`);
      if (duration > 0) chips.push(formatDuration(duration));
      statsEl.innerHTML = chips.map(c => `<span class="stat-chip">${c}</span>`).join('');
      document.getElementById('saved-desc').textContent =
        `Gespeicherter Stand mit ${timeline.length} Element${timeline.length !== 1 ? 'en' : ''} gefunden.`;
      document.getElementById('btn-saved').classList.add('visible');
    } catch(e) {}
  }

  function formatDuration(seconds) {
    const m = Math.floor(seconds / 60);
    const s = Math.round(seconds % 60);
    return m > 0 ? `${m}m ${s}s` : `${s}s`;
  }

  function startNew() {
    fetch('/sync', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ timeline: [], audioUrl: null, barLength: null })
    }).finally(() => { window.location.href = '/editor'; });
  }

  function loadSaved() { window.location.href = '/editor'; }

  checkSavedProject();
</script>
</body>
</html>
