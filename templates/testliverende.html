<img id="video" />
<audio id="audio" controls>
  <source src="{{ url_for('static', filename='music.mp3') }}" type="audio/mpeg">
</audio>
<button id="playBtn">Play</button>
<button id="pauseBtn">Pause</button>

<script>
const img = document.getElementById('video');
const audio = document.getElementById('audio');

// Video-Client
const wsVideo = new WebSocket("ws://localhost:8299");
wsVideo.onopen = () => {
  wsVideo.send(JSON.stringify({ role: "video" }));
};
wsVideo.onmessage = (event) => {
  img.src = 'data:image/jpeg;base64,' + event.data;
};

// Control-Client
const wsCtrl = new WebSocket("ws://localhost:8299");
wsCtrl.onopen = () => {
  wsCtrl.send(JSON.stringify({ role: "control" }));
};

function sendState() {
  if (wsCtrl.readyState !== WebSocket.OPEN) return;
  wsCtrl.send(JSON.stringify({
    role: "control",    // wird im Handler ignoriert, ist aber ok
    t: audio.currentTime,
    playing: !audio.paused
  }));
}

setInterval(sendState, 40);

document.getElementById('playBtn').onclick = () => audio.play();
document.getElementById('pauseBtn').onclick = () => audio.pause();

audio.addEventListener('seeked', sendState);
audio.addEventListener('play', sendState);
audio.addEventListener('pause', sendState);
</script>
